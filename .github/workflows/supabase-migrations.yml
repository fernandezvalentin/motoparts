name: Deploy migraciones a Supabase

# Aplica las migraciones nuevas de supabase/migrations al proyecto de producción
# cada vez que cambian en main. Requiere los secrets:
#   SUPABASE_ACCESS_TOKEN  (Supabase → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   (la contraseña de la base del proyecto)
#   SUPABASE_PROJECT_ID    (el "Reference ID" del proyecto)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Verificar configuración
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Faltan secrets de Supabase (ver comentario al inicio de este workflow)."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push --remote --yes
