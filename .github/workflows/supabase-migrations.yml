name: Deploy migraciones a Supabase

# Aplica las migraciones nuevas de supabase/migrations a las dos bases:
#   - produccion: el proyecto del negocio.
#   - demo: el proyecto de la demo pública (se saltea si no tiene secrets cargados).
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN       (Supabase → Account → Access Tokens; sirve para los dos proyectos)
#   SUPABASE_PROJECT_ID         / SUPABASE_DB_PASSWORD        (producción)
#   SUPABASE_PROJECT_ID_DEMO    / SUPABASE_DB_PASSWORD_DEMO   (demo)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Migraciones (${{ matrix.destino }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        destino: [produccion, demo]
    concurrency:
      group: supabase-migrations-${{ matrix.destino }}
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ matrix.destino == 'demo' && secrets.SUPABASE_DB_PASSWORD_DEMO || secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ matrix.destino == 'demo' && secrets.SUPABASE_PROJECT_ID_DEMO || secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Verificar configuración
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            if [ "${{ matrix.destino }}" = "demo" ]; then
              echo "::notice::La demo no tiene secrets cargados: se saltea."
              echo "saltear=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Faltan secrets de Supabase (ver comentario al inicio de este workflow)."
            exit 1
          fi
      - if: steps.config.outputs.saltear != 'true'
        uses: actions/checkout@v5
      - if: steps.config.outputs.saltear != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.config.outputs.saltear != 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - if: steps.config.outputs.saltear != 'true'
        run: supabase db push --remote --yes
