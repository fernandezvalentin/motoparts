name: Keepalive Supabase

# Supabase pausa los proyectos gratuitos tras 7 días sin actividad.
# Este cron llama a /api/cron/keepalive (que consulta la base) cada 2 días.
# Nota: GitHub solo ejecuta los workflows programados desde la rama por defecto.

on:
  schedule:
    - cron: "17 12 */2 * *" # 09:17 hora de Argentina, cada 2 días
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar configuración
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Faltan los secrets APP_URL y/o CRON_SECRET (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Llamar al endpoint de keepalive
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/keepalive"
