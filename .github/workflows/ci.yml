name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint y build de Next.js
    runs-on: ubuntu-latest
    env:
      # Valores de ejemplo: el build no se conecta a Supabase
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  database:
    name: Validar migraciones SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Crear los roles que existen en Supabase
        run: |
          psql -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls; grant usage on schema public to anon, authenticated;"
      - name: Aplicar migraciones
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Aplicando $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Prueba rápida de las funciones
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          set role authenticated;
          select importar_productos('[{"sku":"T1","nombre":"Test","precioLista":100,"precioPublico":150,"stock":5}]');
          select registrar_venta('[{"productoId":1,"cantidad":2}]', 'Efectivo', 10);
          do $$ begin
            if (select stock_actual from productos where id = 1) <> 3 then raise exception 'stock incorrecto'; end if;
            if (select total from ventas where id = 1) <> 270 then raise exception 'total incorrecto'; end if;
          end $$;
          select eliminar_venta(1);
          select estadisticas_inventario();
          select buscar_productos('test');
          SQL
